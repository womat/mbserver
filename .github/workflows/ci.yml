# Vet, test and scan on every push and pull request.
#
# Actions are pinned to a commit SHA, with the release it belongs to in a
# comment; dependabot (.github/dependabot.yml) proposes updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # the newest patch release, not the one cached on the runner: govulncheck
          # flags a standard library fixed in a newer patch
          check-latest: true
          cache: true

      # TestModbusRTU serves RTU over a pair of virtual serial ports created by socat.
      - name: Install socat
        run: sudo apt-get install -y --no-install-recommends socat

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      # Pinned rather than @latest, so a new release cannot turn CI red without a
      # change here. dependabot does not see go install lines - raise it by hand.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
